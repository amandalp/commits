<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="commits">
  <!-- Cream disc, warm off-white app background -->
  <circle cx="50" cy="50" r="50" fill="#f5f3ee" />
  <!-- Brush-marker lowercase "c" in warm ink -->
  <path
    d="M67 35 C55 25 37 28 30 43 C24 55 28 71 42 74 C53 76 62 71 67 64"
    stroke="#1b1a16"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Violet period — said it, full stop -->
  <circle cx="75" cy="70" r="6.5" fill="#6d5ae6" />
</svg>
